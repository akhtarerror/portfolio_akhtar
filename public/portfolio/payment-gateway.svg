<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#fff6e9"/>
  <path d="M150 70 C310 10 610 40 700 150 C780 250 750 430 620 500 C480 580 220 580 110 470 C0 360 20 140 150 70 Z" fill="#ff6452" opacity="0.12"/>
  <circle cx="660" cy="150" r="44" fill="#3d5cff" opacity="0.3"/>
  <rect x="100" y="420" width="66" height="66" rx="14" fill="#ffc93c" opacity="0.5" transform="rotate(10 133 453)"/>

  <!-- credit card -->
  <rect x="220" y="200" width="360" height="220" rx="24" fill="#9b5de5" stroke="#211a35" stroke-width="3"/>
  <rect x="220" y="256" width="360" height="40" fill="#211a35"/>
  <rect x="250" y="330" width="80" height="16" rx="4" fill="#ffffff" opacity="0.85"/>
  <rect x="250" y="358" width="180" height="14" rx="4" fill="#ffffff" opacity="0.6"/>
  <rect x="490" y="220" width="50" height="34" rx="6" fill="#ffc93c"/>

  <!-- lock badge -->
  <g transform="translate(560,370)">
    <rect x="-30" y="-6" width="60" height="46" rx="10" fill="#10c79a"/>
    <path d="M-18 -6 v-14 a18 18 0 0 1 36 0 v14" fill="none" stroke="#10c79a" stroke-width="8"/>
    <circle cx="0" cy="18" r="6" fill="#fff6e9"/>
  </g>

  <!-- transfer arrows -->
  <path d="M200 300 h-60" stroke="#211a35" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#211a35"/>
    </marker>
  </defs>

  <text x="400" y="540" text-anchor="middle" font-family="monospace" font-size="18" fill="#211a35" opacity="0.55">SECURE PAYMENT FLOW</text>
</svg>
